# HexaBill – Render blueprint
# In Render Dashboard: Root Directory = empty (repo root). Dockerfile = backend/HexaBill.Api/Dockerfile.
# Build context = repo root so COPY backend/HexaBill.Api/... in Dockerfile works.

services:
  - type: web
    name: hexabill-api
    runtime: docker
    dockerfilePath: backend/HexaBill.Api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
      # Same-origin tenant subdomains are allowed dynamically via IsAllowedProductionOrigin.
      # Keep legacy api.hexabill.company until existing clients finish migration.
      - key: ALLOWED_ORIGINS
        value: https://hexabill.company,https://www.hexabill.company,https://admin.hexabill.company,https://api.hexabill.company
      - key: JwtSettings__SecretKey
        generateValue: true
      - key: Hosting__BaseDomain
        value: hexabill.company
      - key: Hosting__PlatformHost
        value: admin.hexabill.company
      - key: Hosting__ApiHost
        value: api.hexabill.company
      - key: Hosting__EnforcementMode
        value: Enforce
      - key: Hosting__EdgeProxySecret
        sync: false
