name: CI

on:
  pull_request:
    branches: [main, DEV, dev]
  push:
    branches: [main, DEV, dev]

jobs:
  backend:
    name: Backend restore / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore backend/HexaBill.Api/HexaBill.Api.csproj
          dotnet restore backend/HexaBill.Tests/HexaBill.Tests.csproj

      - name: Build
        run: dotnet build backend/HexaBill.Api/HexaBill.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/HexaBill.Tests/HexaBill.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend:
    name: Frontend install / lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/hexabill-ui/package-lock.json

      - name: Install
        working-directory: frontend/hexabill-ui
        run: npm ci

      - name: Lint
        working-directory: frontend/hexabill-ui
        run: npm run lint

      - name: Build
        working-directory: frontend/hexabill-ui
        run: npm run build

  security-scan:
    name: Dependency / filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  docker-build:
    name: Docker image (repo-root context)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/HexaBill.Api/Dockerfile
          push: false
          tags: hexabill-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
