name: Billing return release fix

on:
  push:
    branches: [main-AnanduPC]
  pull_request:
    branches: [main-AnanduPC]
  workflow_dispatch:

concurrency:
  group: billing-return-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-return-sqlite:
    name: Return / receipt / settlement (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: |
          dotnet restore backend/HexaBill.Api/HexaBill.Api.csproj
          dotnet restore tests/HexaBill.Tests/HexaBill.Tests.csproj

      - name: Build
        run: dotnet build tests/HexaBill.Tests/HexaBill.Tests.csproj --configuration Release --no-restore

      - name: Test billing return release slice
        run: >
          dotnet test tests/HexaBill.Tests/HexaBill.Tests.csproj
          --configuration Release --no-build --verbosity normal
          --filter "FullyQualifiedName~ReturnStockTests|FullyQualifiedName~PurchaseReturnStockTests|FullyQualifiedName~PaymentSettlement|FullyQualifiedName~PaymentReceiptTests|FullyQualifiedName~InvoiceEditStockTests|FullyQualifiedName~InvoiceStockValidationTests|FullyQualifiedName~PaymentSettlementReceiptFlowTests|FullyQualifiedName~DailyClosePreviewTests|FullyQualifiedName~DailyCloseSaveTests|FullyQualifiedName~DailyCloseMovementTests|FullyQualifiedName~DailyClosePetrolJourneyTests|FullyQualifiedName~PurchaseCashPaymentTests|FullyQualifiedName~DeployVersionResolverTests"

  billing-return-postgres:
    name: Return concurrency (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hexabill
          POSTGRES_PASSWORD: hexabill_ci_test
          POSTGRES_DB: hexabill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hexabill -d hexabill_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEXABILL_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=hexabill_test;Username=hexabill;Password=hexabill_ci_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore tests/HexaBill.Tests/HexaBill.Tests.csproj

      - name: Build
        run: dotnet build tests/HexaBill.Tests/HexaBill.Tests.csproj --configuration Release --no-restore

      - name: Test PostgreSQL return + daily-close HTTP
        run: >
          dotnet test tests/HexaBill.Tests/HexaBill.Tests.csproj
          --configuration Release --no-build --verbosity normal
          --filter "FullyQualifiedName~ReturnConcurrencyPostgreSqlTests|FullyQualifiedName~HttpIsolationPostgreSqlTests&FullyQualifiedName~DailyClose|FullyQualifiedName~HttpIsolationPostgreSqlTests&FullyQualifiedName~PetrolCash"

  frontend-money-path:
    name: Frontend ledger / receipt / daily-close unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/hexabill-ui/package-lock.json

      - name: Install and test
        working-directory: frontend/hexabill-ui
        run: |
          npm ci
          npm test
